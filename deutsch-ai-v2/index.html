                    )}

                    {/* Listening & Dictation Menu Modal */}
                    {isListeningDictationModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 md:p-8 space-y-6 shadow-2xl">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-xl font-bold text-white">Listening &amp; Dictation</h3>
                                    <button onClick={() => setIsListeningDictationModalOpen(false)} className="p-2 text-slate-400 hover:text-white rounded-lg"><Icons.Cross /></button>
                                </div>
                                <div className="space-y-3">
                                    <button onClick={startSentenceDictation} className="w-full p-4 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-2xl text-left transition-all">
                                        <span className="font-bold text-white block text-sm">🤖 AI Sentence Dictation</span>
                                        <span className="text-xs text-slate-400">AI generates full German sentences using unit vocabulary.</span>
                                    </button>
                                    <button onClick={() => startWordDictation('de_de')} className="w-full p-4 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-2xl text-left transition-all">
                                        <span className="font-bold text-white block text-sm">🔊 German Word ➔ German Spelling</span>
                                        <span className="text-xs text-slate-400">Listen to German audio and type correct German spelling.</span>
                                    </button>
                                    <button onClick={() => startWordDictation('en_de')} className="w-full p-4 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-2xl text-left transition-all">
                                        <span className="font-bold text-white block text-sm">🔤 English Audio ➔ German Spelling</span>
                                        <span className="text-xs text-slate-400">Listen to English meaning and type German word.</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Folder Modal */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <form onSubmit={handleSaveFolder} className="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 md:p-8 space-y-5 shadow-2xl">
                                <h3 className="text-xl font-bold text-white">{editingFolder ? 'Edit Folder' : 'New Folder'}</h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Folder Name</label>
                                    <input type="text" required value={folderForm.name} onChange={(e) => setFolderForm({ ...folderForm, name: e.target.value })} placeholder="e.g. A1 Level German" className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Description (Optional)</label>
                                    <textarea value={folderForm.description} onChange={(e) => setFolderForm({ ...folderForm, description: e.target.value })} placeholder="Brief summary of contents..." rows="3" className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500 text-sm"></textarea>
                                </div>
                                <div className="flex items-center justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsFolderModalOpen(false)} className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow">Save Folder</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Set Modal */}
                    {isSetModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <form onSubmit={handleSaveSet} className="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 md:p-8 space-y-5 shadow-2xl">
                                <h3 className="text-xl font-bold text-white">{editingSet ? 'Edit Study Set' : 'New Study Set'}</h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Set Title</label>
                                    <input type="text" required value={setForm.title} onChange={(e) => setSetForm({ ...setForm, title: e.target.value })} placeholder="e.g. Lektion 1: Begrüßung" className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Description (Optional)</label>
                                    <textarea value={setForm.description} onChange={(e) => setSetForm({ ...setForm, description: e.target.value })} placeholder="Brief notes..." rows="3" className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500 text-sm"></textarea>
                                </div>
                                <div className="flex items-center justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsSetModalOpen(false)} className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow">Save Set</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Card Modal (Includes Image Upload - Feature 2) */}
                    {isCardModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in overflow-y-auto">
                            <form onSubmit={handleSaveCard} className="bg-slate-800 border border-slate-700 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-4 shadow-2xl my-8">
                                <h3 className="text-xl font-bold text-white">{editingCard ? 'Edit Vocabulary Card' : 'New Vocabulary Card'}</h3>
                                
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Article</label>
                                        <select value={cardForm.article} onChange={(e) => setCardForm({ ...cardForm, article: e.target.value })} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                                            <option value="">(None)</option>
                                            <option value="der">der</option>
                                            <option value="die">die</option>
                                            <option value="das">das</option>
                                        </select>
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">German Word *</label>
                                        <input type="text" required value={cardForm.german} onChange={(e) => setCardForm({ ...cardForm, german: e.target.value })} placeholder="e.g. Suppe" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">IPA Phonetic</label>
                                        <input type="text" value={cardForm.ipa} onChange={(e) => setCardForm({ ...cardForm, ipa: e.target.value })} placeholder="/ˈzʊpə/" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Part of Speech</label>
                                        <select value={cardForm.partOfSpeech} onChange={(e) => setCardForm({ ...cardForm, partOfSpeech: e.target.value })} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
                                            <option value="">Noun / Other</option>
                                            <option value="verb">Verb</option>
                                            <option value="adj">Adjective</option>
                                            <option value="adv">Adverb</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Plural Form</label>
                                        <input type="text" value={cardForm.plural} onChange={(e) => setCardForm({ ...cardForm, plural: e.target.value })} placeholder="e.g. die Suppen" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">Meaning (English/Vietnamese) *</label>
                                        <input type="text" required value={cardForm.vietnamese} onChange={(e) => setCardForm({ ...cardForm, vietnamese: e.target.value })} placeholder="e.g. Soup" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Example Sentence (German)</label>
                                    <input type="text" value={cardForm.example} onChange={(e) => setCardForm({ ...cardForm, example: e.target.value })} placeholder="Die Suppe schmeckt sehr gut." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Example Translation</label>
                                    <input type="text" value={cardForm.exampleTranslation} onChange={(e) => setCardForm({ ...cardForm, exampleTranslation: e.target.value })} placeholder="The soup tastes very good." className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                </div>

                                {/* Image Upload Feature (Feature 2) */}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Card Image (Upload from Device or URL)</label>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onload = (uploadEvent) => {
                                                        setCardForm(prev => ({ ...prev, imageUrl: uploadEvent.target.result }));
                                                    };
                                                    reader.readAsDataURL(file);
                                                }
                                            }}
                                            className="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer"
                                        />
                                        {cardForm.imageUrl && (
                                            <button type="button" onClick={() => setCardForm(prev => ({ ...prev, imageUrl: '' }))} className="text-xs text-rose-400 hover:text-rose-300">Remove</button>
                                        )}
                                    </div>
                                    <input 
                                        type="text" 
                                        value={cardForm.imageUrl} 
                                        onChange={(e) => setCardForm({ ...cardForm, imageUrl: e.target.value })} 
                                        placeholder="Or paste image URL here..." 
                                        className="mt-2 w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" 
                                    />
                                    {cardForm.imageUrl && (
                                        <div className="mt-2 w-16 h-16 rounded-lg bg-slate-900 overflow-hidden border border-slate-700">
                                            <img src={cardForm.imageUrl} alt="Preview" className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'} />
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center justify-end gap-3 pt-3">
                                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow">Save Card</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* AI Vocabulary Creation Modal (Feature 4: Noun gender display options & Verb participle options) */}
                    {isAiImportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in overflow-y-auto">
                            <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-5 shadow-2xl my-8">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Sparkles /> AI Vocabulary Creator</h3>
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="p-2 text-slate-400 hover:text-white rounded-lg"><Icons.Cross /></button>
                                </div>
                                <p className="text-xs text-slate-400">Paste text, vocabulary list, or article excerpt. Gemini AI will extract German vocabulary with phonetics, genders, and verb forms.</p>

                                {/* Group A — Noun gender display (Mutually exclusive - Feature 4) */}
                                <div className="p-4 bg-slate-900 border border-slate-700/80 rounded-2xl space-y-3">
                                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">Group A — Noun Gender Display</span>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button 
                                            type="button" 
                                            onClick={() => updateGenderDisplayStyle('color_word')} 
                                            className={`p-3 rounded-xl border text-xs font-semibold text-left transition-all ${genderDisplayStyle === 'color_word' ? 'bg-amber-500/20 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                        >
                                            <div className="font-bold mb-1">Option 1: Gender Label Color</div>
                                            <div className="text-[10px] text-slate-400">der (blue), das (green), die (pink)</div>
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => updateGenderDisplayStyle('colored_dot')} 
                                            className={`p-3 rounded-xl border text-xs font-semibold text-left transition-all ${genderDisplayStyle === 'colored_dot' ? 'bg-amber-500/20 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                        >
                                            <div className="font-bold mb-1">Option 2: Colored Dot</div>
                                            <div className="text-[10px] text-slate-400">Small colored dot before noun</div>
                                        </button>
                                    </div>
                                </div>

                                {/* Group B — Verb form display (Independent toggles - Feature 4) */}
                                <div className="p-4 bg-slate-900 border border-slate-700/80 rounded-2xl space-y-3">
                                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">Group B — Verb Form Display (Independent Toggles)</span>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button 
                                            type="button" 
                                            onClick={toggleAiVerbPerfekt} 
                                            className={`p-3 rounded-xl border text-xs font-semibold text-left transition-all flex items-center justify-between ${aiVerbFormPerfekt ? 'bg-amber-500/20 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                        >
                                            <div>
                                                <div className="font-bold">Partizip Perfekt</div>
                                                <div className="text-[10px] text-slate-400">e.g. gemacht</div>
                                            </div>
                                            <div className={`w-4 h-4 rounded border flex items-center justify-center ${aiVerbFormPerfekt ? 'bg-amber-500 border-amber-500 text-slate-950 font-bold text-xs' : 'border-slate-600'}`}>{aiVerbFormPerfekt ? '✓' : ''}</div>
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={toggleAiVerbPrasens} 
                                            className={`p-3 rounded-xl border text-xs font-semibold text-left transition-all flex items-center justify-between ${aiVerbFormPrasens ? 'bg-amber-500/20 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                        >
                                            <div>
                                                <div className="font-bold">Partizip Präsens</div>
                                                <div className="text-[10px] text-slate-400">e.g. machend</div>
                                            </div>
                                            <div className={`w-4 h-4 rounded border flex items-center justify-center ${aiVerbFormPrasens ? 'bg-amber-500 border-amber-500 text-slate-950 font-bold text-xs' : 'border-slate-600'}`}>{aiVerbFormPrasens ? '✓' : ''}</div>
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Source Text / Vocabulary List</label>
                                    <textarea rows="4" value={importRawText} onChange={(e) => setImportRawText(e.target.value)} placeholder="Paste German text here..." className="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-white focus:outline-none focus:border-amber-500 text-sm"></textarea>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Special Instructions (Optional)</label>
                                    <input type="text" value={customPromptNote} onChange={(e) => setCustomPromptNote(e.target.value)} placeholder="e.g. Focus on B1 verbs and food nouns" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm" />
                                </div>

                                <div className="flex items-center justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsAiImportModalOpen(false)} className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button type="button" disabled={isAiImporting || !importRawText.trim()} onClick={handleAIImport} className="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-amber-500/20 flex items-center gap-2">
                                        {isAiImporting ? <span className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span> : <Icons.Sparkles />}
                                        Generate Flashcards
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Settings & API Key Modal */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 md:p-8 space-y-5 shadow-2xl">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Key /> Settings &amp; API Key</h3>
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="p-2 text-slate-400 hover:text-white rounded-lg"><Icons.Cross /></button>
                                </div>
                                <p className="text-xs text-slate-400">Enter your Gemini API key to enable AI Vocabulary Creation, Fill-in-the-Blank, and Custom AI Exercises.</p>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Gemini API Key</label>
                                    <input type="password" value={userApiKey} onChange={(e) => setUserApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white font-mono text-sm focus:outline-none focus:border-amber-500" />
                                </div>
                                <div className="flex items-center justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsApiKeyModalOpen(false)} className="px-4 py-2 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button type="button" onClick={() => saveApiKey(userApiKey)} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow">Save API Key</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Confirmation Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
                                <h3 className="text-lg font-bold text-white">Confirm Action</h3>
                                <p className="text-sm text-slate-300">{confirmDialog.message}</p>
                                <div className="flex items-center justify-center gap-3 pt-2">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="px-4 py-2 bg-slate-900 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs shadow">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
