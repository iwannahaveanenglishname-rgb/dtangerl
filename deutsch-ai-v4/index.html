                                                Partizip Präsens
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Paste text to extract vocabulary *</label>
                                        <textarea value={importRawText} onChange={e => setImportRawText(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500 h-32 resize-none" placeholder="Paste German text, article, or vocabulary list here..." />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Custom instructions (Optional)</label>
                                        <input type="text" value={customPromptNote} onChange={e => setCustomPromptNote(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500" placeholder="e.g. Focus on food vocabulary and verbs" />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsAiImportModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</button>
                                    <button type="button" disabled={isAiImporting || !importRawText.trim()} onClick={handleAIImport} className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-bold rounded-xl text-sm flex items-center gap-2">
                                        {isAiImporting ? 'Generating...' : 'Generate with AI'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* QUIZ CONFIG MODAL */}
                    {isQuizConfigOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl animate-fade-in">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Quiz /> Exercise Configuration</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Exercise Mode</label>
                                        <select value={quizConfig.quizMode} onChange={e => setQuizConfig({...quizConfig, quizMode: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                                            <option value="mixed">Mixed Vocabulary Practice</option>
                                            <option value="spelling">Spelling</option>
                                            <option value="gender">Noun Gender</option>
                                            <option value="plural">Noun Plural</option>
                                            <option value="fill_blank">AI Fill-in-the-Blank</option>
                                            <option value="ai_prompt">Custom AI Exercise</option>
                                        </select>
                                    </div>

                                    {quizConfig.quizMode === 'ai_prompt' && (
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Describe Custom Exercise *</label>
                                            <textarea value={quizConfig.customPrompt} onChange={e => setQuizConfig({...quizConfig, customPrompt: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500 h-24 resize-none" placeholder="e.g. Create 8 accusative case practice questions..." />
                                        </div>
                                    )}

                                    {quizConfig.quizMode !== 'ai_prompt' && (
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Answer Format</label>
                                            <select value={quizConfig.answerFormat} onChange={e => setQuizConfig({...quizConfig, answerFormat: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                                                <option value="mixed">Mixed (Multiple Choice &amp; Written)</option>
                                                <option value="multiple_choice">Multiple Choice Only</option>
                                                <option value="written">Written Input Only</option>
                                            </select>
                                        </div>
                                    )}
                                </div>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setIsQuizConfigOpen(false)} className="px-4 py-2 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</button>
                                    <button onClick={() => startQuiz(false)} className="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm">Start Exercise</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LISTENING & DICTATION MODAL */}
                    {isListeningDictationModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl animate-fade-in">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Speaker /> Listening &amp; Dictation</h3>
                                <div className="space-y-3">
                                    <button onClick={startSentenceDictation} className="w-full p-4 bg-teal-600/20 hover:bg-teal-600/30 border border-teal-500/40 rounded-2xl text-left transition-all">
                                        <h4 className="font-bold text-teal-300 text-base mb-1">AI Sentence Dictation 🤖</h4>
                                        <p className="text-xs text-slate-400">AI generates sentences using unit vocabulary for dictation practice.</p>
                                    </button>
                                    <button onClick={() => startWordDictation('de_de')} className="w-full p-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl text-left transition-all">
                                        <h4 className="font-bold text-white text-sm mb-1">German Audio ➔ German Spelling</h4>
                                        <p className="text-xs text-slate-400">Listen to German words and type the correct spelling.</p>
                                    </button>
                                    <button onClick={() => startWordDictation('en_de')} className="w-full p-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl text-left transition-all">
                                        <h4 className="font-bold text-white text-sm mb-1">English Audio ➔ German Spelling</h4>
                                        <p className="text-xs text-slate-400">Listen to English meanings and type the German translation.</p>
                                    </button>
                                    <button onClick={() => startWordDictation('de_en')} className="w-full p-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl text-left transition-all">
                                        <h4 className="font-bold text-white text-sm mb-1">German Audio ➔ English Meaning</h4>
                                        <p className="text-xs text-slate-400">Listen to German audio and type the English meaning.</p>
                                    </button>
                                </div>
                                <div className="flex justify-end pt-2">
                                    <button onClick={() => setIsListeningDictationModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* API KEY MODAL */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl animate-fade-in">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Key /> Gemini API Key</h3>
                                <p className="text-xs text-slate-400">Enter your Google Gemini API key to enable AI vocabulary generation and custom exercises.</p>
                                <input type="password" value={userApiKey} onChange={e => setUserApiKey(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 font-mono" placeholder="AIzaSy..." />
                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</button>
                                    <button onClick={() => saveApiKey(userApiKey)} className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm">Save Key</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM DIALOG */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl animate-fade-in text-center">
                                <h4 className="text-lg font-bold text-white">{confirmDialog.message}</h4>
                                <div className="flex gap-3 justify-center pt-2">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-medium">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html></html>
